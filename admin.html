<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точка Моды | Административная панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F5F0E8;
            color: #3D2B1F;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .admin-sidebar {
            width: 280px;
            background: #4A5B3A;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .admin-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #F5F0E8;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(245, 240, 232, 0.2);
        }

        .admin-logo i {
            margin-right: 10px;
        }

        .admin-nav {
            list-style: none;
        }

        .admin-nav li {
            margin-bottom: 10px;
        }

        .admin-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #F5F0E8;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
        }

        .admin-nav a:hover,
        .admin-nav a.active {
            background: rgba(245, 240, 232, 0.2);
        }

        .admin-main {
            margin-left: 280px;
            padding: 30px;
            width: 100%;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: #6B8C5C;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #4A5B3A;
        }

        .admin-table {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #E8E0D5;
        }

        th {
            color: #6B8C5C;
            font-weight: 600;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            margin: 0 5px;
        }

        .btn-edit {
            background: #6B8C5C;
            color: white;
        }

        .btn-delete {
            background: #C5D1B5;
            color: #4A5B3A;
        }

        .form-add {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #C5D1B5;
            border-radius: 8px;
            background: #F5F0E8;
        }

        .btn-primary {
            background: #6B8C5C;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #4A5B3A;
        }

        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                transition: 0.3s;
                z-index: 1000;
            }
            .admin-sidebar.open {
                transform: translateX(0);
            }
            .admin-main {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-sidebar" id="adminSidebar">
        <div class="admin-logo">
            <i class="fas fa-tshirt"></i> Точка Моды
        </div>
        <ul class="admin-nav">
            <li><a href="#" data-page="dashboard" class="active"><i class="fas fa-chart-line"></i> Дашборд</a></li>
            <li><a href="#" data-page="orders"><i class="fas fa-shopping-cart"></i> Заказы (CRM)</a></li>
            <li><a href="#" data-page="products"><i class="fas fa-box"></i> Товары</a></li>
            <li><a href="#" data-page="promocodes"><i class="fas fa-tag"></i> Промокоды</a></li>
            <li><a href="#" data-page="users"><i class="fas fa-users"></i> Пользователи</a></li>
            <li><a href="#" id="logoutAdminBtn"><i class="fas fa-sign-out-alt"></i> Выйти</a></li>
        </ul>
    </div>

    <div class="admin-main">
        <div class="admin-header">
            <h1 id="pageTitle">Панель управления</h1>
            <button class="btn-primary" id="menuToggleAdmin" style="display: none;">☰ Меню</button>
        </div>
        <div id="adminContent"></div>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
