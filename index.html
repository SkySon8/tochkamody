<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точка Моды | Стиль и качество</title>
    <meta name="description" content="Точка Моды — интернет-магазин стильной одежды, обуви, сумочек и аксессуаров. Скидки до 70%. Быстрая доставка по всей России.">
    <meta name="keywords" content="одежда, обувь, сумки, аксессуары, интернет-магазин, скидки, мода, Точка Моды">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F5F0E8 0%, #E8E0D5 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #F5F0E8 0%, #E8E0D5 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .splash-content {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            animation: fadeInUp 1s ease;
        }

        .splash-image {
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .splash-badge {
            background: #6B8C5C;
            color: #F5F0E8;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 20px;
        }

        .splash-title {
            font-size: 3rem;
            font-weight: 700;
            color: #4A5B3A;
            margin-bottom: 15px;
        }

        .splash-subtitle {
            color: #6B8C5C;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .discount-tag {
            background: #4A5B3A;
            color: #F5F0E8;
            padding: 15px 25px;
            border-radius: 60px;
            display: inline-block;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .btn-shop {
            background: #6B8C5C;
            color: #F5F0E8;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-shop:hover {
            background: #4A5B3A;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .splash-title {
                font-size: 2rem;
            }
            .splash-image {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
<div class="splash-screen" id="splashScreen">
    <div class="splash-content">
        <span class="splash-badge"><i class="fas fa-gem"></i> Весенняя коллекция 2026</span>
        <h1 class="splash-title">Точка Моды</h1>
        <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Стильная одежда" class="splash-image">
        <div class="discount-tag">
            <i class="fas fa-tag"></i> Скидки до 70% на первую покупку
        </div>
        <p class="splash-subtitle">Эксклюзивные коллекции • Быстрая доставка • Гарантия качества</p>
        <button class="btn-shop" id="enterShopBtn">
            <i class="fas fa-arrow-right"></i> Перейти в магазин
        </button>
    </div>
</div>

<script>
    document.getElementById('enterShopBtn').addEventListener('click', () => {
        document.getElementById('splashScreen').style.opacity = '0';
        setTimeout(() => {
            window.location.href = 'shop.html';
        }, 500);
    });
</script>
</body>
</html>
